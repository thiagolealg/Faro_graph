name: FARO MVP - tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install '.[dev]'
      - name: Run test suite
        run: python -m pytest
      - name: Check Python and browser syntax
        run: |
          python -m compileall -q services/api-gateway/faro_api
          node --check apps/consumer-web/main.js

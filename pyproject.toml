[project]
name = "faro-graph"
version = "0.7.0"
description = "MVP da plataforma FARO: triagem de URLs e grafo de indicadores"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "pydantic>=2,<3",
    "idna>=3,<4",
    "dnspython>=2.6,<3",
    "httpx>=0.27,<1",
    "PyJWT[crypto]>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/security"]
addopts = "-q"

[tool.ruff]
line-length = 110

[tool.setuptools.package-data]
"faro_api" = ["data/*.dat"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "services/api-gateway"}
packages = ["faro_api"]
